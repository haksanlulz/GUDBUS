name: Tests

# Runs the pytest suite on every PR and on pushes to trunk and to the release
# branch, across the min and a current supported Python. No GCS data is
# vendored here (that would clone a third-party repo on every run), so the ~18
# vendored-data tests skip; deploy.sh exercises them at deploy time.
on:
  pull_request:
  # dev is trunk, main is the release branch. Both run the suite: a split where
  # trunk is untested hides breakage rather than isolating it.
  push:
    branches: [main, dev]
  workflow_dispatch:
  # Callable so docker-publish.yml can gate on it. Publishing used to be
  # completely independent of this workflow, which meant a commit with a red
  # matrix still produced a pullable image — and the deploy runsheet reads the
  # tag, not the test result.
  workflow_call:

concurrency:
  # Namespaced by workflow, not just ref. docker-publish.yml calls this as a
  # gating job, so on a push to main it runs twice — once standalone, once
  # called. With a shared group the two collide and one cancels the other,
  # which left the commit showing a CANCELLED "Tests" check even though the
  # matrix had passed inside the publish run. An ambiguous check is worse than
  # a duplicated one, and the duplicate costs about 45 seconds.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest -q

  # Type check, scoped on purpose. pyright has been a declared dev dependency
  # since before 1.0 and nothing ever ran it; a repo-wide gate is not landable
  # (measured 2026-09-15 on pyright 1.1.409: 189 errors — cogs 143, services
  # 23, ui 23, and none anywhere else — mostly discord.py's Interaction.client
  # not carrying the bot's .db attribute and guild_id: int | None flowing into
  # int params).
  #
  # COVERED: gurps_bot/gcs, gurps_bot/utils, gurps_bot/db, gurps_bot/mechanics,
  #   and gurps_bot/*.py — the loose root modules (bot.py, __main__.py,
  #   command_sync.py, config.py) are not a package, so they sat outside both
  #   lists until the glob was added; they are clean and now gated
  # NOT COVERED: gurps_bot/cogs, gurps_bot/ui, gurps_bot/services, tools,
  #   tests, and gurps_bot/data (vendored GCS JSON, gitignored, no Python)
  #
  # That is 4 of the 7 packages under gurps_bot/, named rather than implied so
  # the coverage claim cannot read as total. Not all four were clean when this
  # landed: gcs and utils were, db came clean one commit earlier (the schema
  # gate), and mechanics carried 2 reportArgumentType errors in magic.py's
  # long_distance_modifier that the commit adding this gate fixed. mechanics is
  # the one that pays: it is the pure-rules layer, where a GURPS constant with
  # the wrong type is a wrong answer at a table. Widen by moving a package up a
  # line once it is clean; do not add one that is not.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv + Python 3.10
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # The floor, not the ceiling: pyright resolves the stdlib against the
          # interpreter it runs under, so a 3.10-only type error is the one this
          # would otherwise miss. Once, not per matrix leg.
          python-version: "3.10"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check the covered layers
        run: uv run pyright gurps_bot/gcs gurps_bot/utils gurps_bot/db gurps_bot/mechanics gurps_bot/*.py
